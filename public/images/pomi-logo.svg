<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Circle Radial Gradient -->
    <radialGradient id="bgGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#241e12"/>
      <stop offset="60%" stop-color="#14110b"/>
      <stop offset="100%" stop-color="#0a0805"/>
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89e"/>
      <stop offset="30%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa820a"/>
      <stop offset="100%" stop-color="#f5d77f"/>
    </linearGradient>

    <!-- Liquid Essence Gradient -->
    <linearGradient id="essenceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe494" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#997008" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Dark Badge with Double Gold Ring -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="50" cy="50" r="44.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="2.5 1.5" opacity="0.6"/>

  <!-- Luxury Perfume Flacon Silhouette -->
  <!-- Cap / Stopper (Faceted Crystal Cut) -->
  <rect x="42" y="16" width="16" height="12" rx="2" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
  <rect x="44.5" y="18" width="11" height="8" rx="1" fill="#14110b" opacity="0.4"/>

  <!-- Atomizer Neck & Golden Collar -->
  <rect x="46" y="28" width="8" height="5" fill="url(#goldGrad)"/>
  <rect x="39" y="32" width="22" height="3" rx="1" fill="url(#goldGrad)"/>

  <!-- Glass Bottle Body (Square / Shoulder Architectural Luxury Cut) -->
  <path d="M 33 36 
           C 33 35, 67 35, 67 36 
           L 70 41 
           L 69 77 
           C 69 81, 65 83, 61 83 
           L 39 83 
           C 35 83, 31 81, 31 77 
           L 30 41 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Liquid Fragrance Fill -->
  <path d="M 34.5 50 
           Q 42 48, 50 50 
           T 65.5 50 
           L 65 76 
           C 65 78.5, 62 80, 59 80 
           L 41 80 
           C 38 80, 35 78.5, 35 76 Z" 
        fill="url(#essenceGrad)"/>

  <!-- Inner Crest / Brand Emblem Monogram P on Bottle -->
  <path d="M 46 54 L 46 70 M 46 54 L 52 54 C 55 54, 57 56, 57 58.5 C 57 61, 55 63, 52 63 L 46 63" 
        fill="none" stroke="#120e06" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 46 54 L 46 70 M 46 54 L 52 54 C 55 54, 57 56, 57 58.5 C 57 61, 55 63, 52 63 L 46 63" 
        fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Delicate Sparkle Accents -->
  <path d="M 23 27 Q 25 29 27 29 Q 25 29 25 31 Q 25 29 23 29 Q 25 29 23 27 Z" fill="url(#goldGrad)" opacity="0.9"/>
  <path d="M 74 24 Q 75.5 25.5 77 25.5 Q 75.5 25.5 75.5 27 Q 75.5 25.5 74 25.5 Q 75.5 25.5 74 24 Z" fill="url(#goldGrad)" opacity="0.85"/>
  <circle cx="73" cy="68" r="1.2" fill="url(#goldGrad)" opacity="0.7"/>
  <circle cx="27" cy="62" r="1" fill="url(#goldGrad)" opacity="0.6"/>
</svg>
